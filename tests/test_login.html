<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test connexion</title>

    <link rel="stylesheet" href="../assets/styles/login.css">
</head>
<body>

<main class="login-page">
    <section class="login-presentation">
        <h2>Sortir.com</h2>
        <p>Organisez et partagez vos sorties entre stagiaires.</p>
    </section>

    <section class="login-container">
        <form class="login-form" action="#" onsubmit="return false;">
            <h1>Se connecter</h1>

            <label for="username">Identifiant</label>
            <input type="text" id="username">

            <label for="password">Mot de passe</label>
            <input type="password" id="password">

            <div class="circle circle1"></div>
            <div class="circle circle2"></div>
            <div class="circle circle3"></div>
            <div

            <div class="login-actions">
                <button type="submit">Se connecter</button>

                <div class="remember">
                    <div>
                        <input type="checkbox" id="_remember_me">
                        <label for="_remember_me">Se souvenir de moi</label>
                    </div>

                    <a href="#">Mot de passe oublié ?</a>
                </div>
            </div>
        </form>
    </section>
</main>

</body>
</html>
